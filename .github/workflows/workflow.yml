# This workflow uses actions to build and test your Flutter project.
#
# You can learn more about GitHub Actions here:
# https://docs.github.com/en/actions
# Flutter CI/CD

name: Flutter CI/CD

on:
  push:
    branches: [ "main" ] # Triggers the workflow on a push to the main branch.  Change to your main branch if different.
 

jobs:
  build:
    name: Build and Test Flutter # Friendly name for the job in the GitHub Actions UI.
    runs-on: ubuntu-latest # Uses a Ubuntu virtual machine.  Consider macOS for iOS builds.

    steps:
      - uses: actions/checkout@v4 # Checks out the repository to the GitHub Actions runner.
      - uses: actions/setup-java@v4 # Sets up Java (required for Flutter).
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2 # Sets up Flutter.
        with:
          channel: 'stable' # Or 'dev', 'beta', depending on your Flutter channel preference
          flutter-version: '3.24.2' # Specify Flutter version.
      - run: flutter pub get # Gets Flutter dependencies.
      - run: flutter build apk --split-per-abi # Builds an APK.  Change flags for different build types.
      - run: |  #Displays the content of the build
          ls -l build/app/outputs/apk/release/
      - name: Upload APK # Uploads the APK as an artifact.  Useful for manual download.
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/apk/release/*.apk
